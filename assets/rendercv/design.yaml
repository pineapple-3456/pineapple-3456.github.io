      main_column: "**NAME**\nLEVEL\nKEYWORDS\nISSUER\nSUMMARY\nREFERENCE\nHIGHLIGHTS"
    publication_entry:
      main_column: "**PDF_TITLE**\nSUMMARY\nAUTHORS\nPUBLISHER"
